<style>
:root{--purple:#613087;--gold:#FCB715;--orange:#DD5A28;--bg:#f4f0f8;--card:#fff;--ink:#1f1a2b;--muted:#6b6478;--line:#d9d1e4;--accent:#613087;--accent-ink:#fff;--err:#b42318;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15111d;--card:#1f1929;--ink:#eee9f4;--muted:#b1a7c2;--line:#4a3d5c;--accent:#FCB715;--accent-ink:#241536;--err:#ff8a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15111d;--card:#1f1929;--ink:#eee9f4;--muted:#b1a7c2;--line:#4a3d5c;--accent:#FCB715;--accent-ink:#241536;--err:#ff8a7a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;box-shadow:0 12px 32px rgba(97,48,135,.12);border-top:4px solid var(--purple)}
.brand{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--purple);color:var(--gold);display:grid;place-items:center;font:700 13px Arial,sans-serif;letter-spacing:0}
h1{margin:0 0 6px;font-size:21px;line-height:1.3}
.hint{margin:0 0 18px;color:var(--muted);font-size:14px}
label.f{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
input.t{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:16px;background:var(--card);color:var(--ink);margin-bottom:14px}
input.t:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(97,48,135,.15)}
.rem{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin:0 0 18px}
.rem input{width:16px;height:16px;accent-color:var(--purple)}
button.b{width:100%;height:44px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:15px;cursor:pointer}
button.b:disabled{opacity:.6;cursor:progress}
button.b:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.err{min-height:20px;margin:12px 0 0;color:var(--err);font-size:14px}
.links{margin-top:14px;text-align:center;font-size:14px}
.links a{color:var(--accent)}
.loading{color:var(--muted);font-size:15px}
[hidden]{display:none!important}
</style>
</head>

<script>
var LV=(function(){
  var SKEY='lvlh.session', KEYRING='/access/keyring.json', DAY=864e5, subtle=window.crypto&&crypto.subtle;
  function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return('0'+x.toString(16)).slice(-2);}).join('');}
  async function open(raw,blob){
    var d=b64d(blob), key=await subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
    return new Uint8Array(await subtle.decrypt({name:'AES-GCM',iv:d.slice(0,12)},key,d.slice(12)));
  }
  function read(){
    var stores=[];try{stores.push(localStorage);}catch(e){}try{stores.push(sessionStorage);}catch(e){}
    for(var i=0;i<stores.length;i++){try{var s=JSON.parse(stores[i].getItem(SKEY));if(s&&s.exp>Date.now())return s;}catch(e){}}
    return null;
  }
  function logout(){try{localStorage.removeItem(SKEY);}catch(e){}try{sessionStorage.removeItem(SKEY);}catch(e){}}
  // Không hỏi tên đăng nhập: thử mật khẩu với TỪNG tài khoản trong keyring cho tới khi giải mã đúng.
  async function login(p,remember){
    if(!subtle)throw new Error('old');
    var r=await fetch(KEYRING,{cache:'no-store'});if(!r.ok)throw new Error('net');
    var k=await r.json();
    var base=await subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);
    for(var id in k.users){
      var e=k.users[id];
      try{
        var bits=await subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64d(e.s),iterations:k.iter},base,256);
        var b=JSON.parse(new TextDecoder().decode(await open(new Uint8Array(bits),e.w)));
        var s={u:b.u,n:b.n,r:b.r,g:b.g,exp:Date.now()+(remember?30*DAY:DAY)};
        logout();try{(remember?localStorage:sessionStorage).setItem(SKEY,JSON.stringify(s));}catch(x){}
        return s;
      }catch(x){/* sai với tài khoản này, thử tài khoản kế tiếp */}
    }
    throw new Error('bad');
  }
  async function unlock(wraps,s){
    for(var gid in wraps){if(s.g[gid]){try{return await open(b64d(s.g[gid]),wraps[gid]);}catch(e){}}}
    return null;
  }
  function errText(e){
    return e.message==='net'?'Không tải được dữ liệu đăng nhập. Kiểm tra kết nối mạng rồi thử lại.'
      :e.message==='old'?'Trình duyệt này quá cũ. Hãy mở bằng Chrome, Safari hoặc Edge bản mới.'
      :'Sai tên đăng nhập hoặc mật khẩu.';
  }
  return {read:read,login:login,logout:logout,unlock:unlock,open:open,b64d:b64d,errText:errText};
})();

(async function(){
  if(document.readyState==='loading')await new Promise(function(r){document.addEventListener('DOMContentLoaded',r,{once:true});});
  var D=JSON.parse(document.getElementById('lv-data').textContent);
  var $=function(id){return document.getElementById(id);};
  async function reveal(s){
    var ck=await LV.unlock(D.w,s);if(!ck)return false;
    var html=new TextDecoder().decode(await LV.open(ck,D.c));
    document.open();document.write(html);document.close();
    return true;
  }
  function ui(mode,s){
    $('loading').hidden=true;$('gate').hidden=false;
    $('f').hidden=mode!=='login';$('denied').hidden=mode!=='denied';
    if(mode==='denied')$('who').textContent=s.n;else $('p').focus();
  }
  var s=LV.read();
  if(s&&await reveal(s))return;
  ui(s?'denied':'login',s);
  $('sw').addEventListener('click',function(){LV.logout();ui('login');});
  $('f').addEventListener('submit',async function(e){
    e.preventDefault();$('err').textContent='';
    var p=$('p').value;
    if(!p){$('err').textContent='Nhập mật khẩu.';return;}
    $('go').disabled=true;$('go').textContent='Đang kiểm tra…';
    try{s=await LV.login(p,$('r').checked);$('p').value='';if(!(await reveal(s)))ui('denied',s);}
    catch(x){$('err').textContent=LV.errText(x);}
    $('go').disabled=false;$('go').textContent='Mở trang';
  });
})();
</script>
